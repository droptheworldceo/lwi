<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유병장수 · 글쓰기</title>
<link rel="stylesheet" href="css/lwi.css?v=2">
<style>
  .content { flex: 1; overflow-y: auto; padding: 18px 20px 24px; }
  .kind-toggle { display: flex; gap: 8px; margin-bottom: 18px; }
  .kind-toggle button {
    flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--line-strong);
    background: var(--surface); color: var(--ink-soft); font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .kind-toggle button.on.exp { background: var(--accent-ink); border-color: var(--accent); color: var(--accent-deep); }
  .kind-toggle button.on.evi { background: var(--accent-2-soft); border-color: var(--accent-2); color: var(--accent-2); }
  .kind-toggle .desc { font-size: 11.5px; color: var(--ink-faint); margin-top: 6px; }
  #source-field { display: none; }
  .image-field { margin-bottom: 18px; }
  .image-add {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 16px; border-radius: 12px; border: 1px dashed var(--line-strong);
    background: none; color: var(--ink-faint); font-size: 13.5px; cursor: pointer;
  }
  .image-add svg { width: 18px; height: 18px; }
  .image-preview { position: relative; margin-top: 10px; }
  .image-preview img { width: 100%; max-height: 260px; object-fit: cover; border-radius: 12px; display: block; }
  .image-preview button {
    position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(20,12,10,0.6); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .image-preview button svg { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" id="back-link" href="channels.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1 data-i18n="write.title"></h1>
  </div>
  <div class="content">
    <div class="field">
      <label for="channel-select" data-i18n="write.channelLabel"></label>
      <select id="channel-select" style="width:100%; font-size:15px; padding:13px 14px; border-radius:12px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);"></select>
    </div>

    <div class="kind-toggle">
      <div style="flex:1;">
        <button type="button" class="on exp" id="kind-exp" data-i18n="common.kindExperience"></button>
        <div class="desc" data-i18n="write.kindExperienceDesc"></div>
      </div>
      <div style="flex:1;">
        <button type="button" class="evi" id="kind-evi" data-i18n="common.kindEvidence"></button>
        <div class="desc" data-i18n="write.kindEvidenceDesc"></div>
      </div>
    </div>

    <div class="field" id="source-field">
      <label for="source" data-i18n="write.sourceLabel"></label>
      <input id="source" type="text" data-i18n-placeholder="write.sourcePlaceholder">
    </div>

    <div class="image-field">
      <input type="file" id="image-input" accept="image/*" style="display:none;">
      <button type="button" class="image-add" id="image-add-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        <span data-i18n="write.imageAdd"></span>
      </button>
      <div class="image-preview" id="image-preview" style="display:none;">
        <img id="image-preview-img" alt="">
        <button type="button" id="image-remove-btn" aria-label="remove">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <div class="field">
      <label for="body" data-i18n="write.bodyLabel"></label>
      <textarea id="body" rows="8" data-i18n-placeholder="write.bodyPlaceholder"></textarea>
      <div class="error" id="err-body"></div>
    </div>

    <p style="font-size:12px; color:var(--ink-faint); margin: -6px 0 18px;" data-i18n="write.disclaimer"></p>
    <p class="error" id="err-banned" style="display:none; margin: -12px 0 18px;"></p>

    <button class="btn btn-primary" id="submit-btn" data-i18n="write.submit"></button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js?v=2"></script>
<script src="js/firebase-init.js?v=2"></script>
<script src="js/auth.js?v=2"></script>
<script src="js/data.js?v=7"></script>
<script src="js/i18n.js?v=1"></script>
<script src="js/ui.js?v=1"></script>
<script>
  var params = new URLSearchParams(window.location.search);
  var selectedFile = null;
  var imageInput = document.getElementById("image-input");
  var imagePreview = document.getElementById("image-preview");
  var imagePreviewImg = document.getElementById("image-preview-img");
  var imageAddBtn = document.getElementById("image-add-btn");

  imageAddBtn.addEventListener("click", function () { imageInput.click(); });
  imageInput.addEventListener("change", function () {
    var file = imageInput.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      window.LWI.showToast(window.LWI.t("write.imageTooLarge"));
      imageInput.value = "";
      return;
    }
    selectedFile = file;
    imagePreviewImg.src = URL.createObjectURL(file);
    imagePreview.style.display = "block";
    imageAddBtn.style.display = "none";
  });
  document.getElementById("image-remove-btn").addEventListener("click", function () {
    selectedFile = null;
    imageInput.value = "";
    imagePreview.style.display = "none";
    imageAddBtn.style.display = "flex";
  });
  var presetChannel = params.get("channel");
  if (presetChannel) document.getElementById("back-link").href = "channel.html?id=" + encodeURIComponent(presetChannel);

  var kind = "experience";
  var expBtn = document.getElementById("kind-exp");
  var eviBtn = document.getElementById("kind-evi");
  var sourceField = document.getElementById("source-field");
  function setKind(next) {
    kind = next;
    expBtn.classList.toggle("on", kind === "experience");
    eviBtn.classList.toggle("on", kind === "evidence");
    sourceField.style.display = kind === "evidence" ? "block" : "none";
  }
  expBtn.addEventListener("click", function () { setKind("experience"); });
  eviBtn.addEventListener("click", function () { setKind("evidence"); });

  var select = document.getElementById("channel-select");
  function fillChannels(channels, joined) {
    select.innerHTML = "";
    channels.forEach(function (c) {
      var opt = document.createElement("option");
      opt.value = c.id; opt.textContent = c.name;
      select.appendChild(opt);
    });
    if (presetChannel) select.value = presetChannel;
  }

  window.LWI.requireAuth(function (user, profile) {
    if (!window.LWI.isConfigured) {
      fillChannels(window.LWI.FALLBACK_MAIN_CHANNELS, []);
      return;
    }
    Promise.all([window.LWI.listChannels("main"), window.LWI.listChannels("sub")]).then(function (results) {
      var all = (results[0].length ? results[0] : window.LWI.FALLBACK_MAIN_CHANNELS).concat(results[1]);
      fillChannels(all, profile.joinedChannels || []);
    }).catch(function (err) {
      console.error("listChannels failed", err);
      fillChannels(window.LWI.FALLBACK_MAIN_CHANNELS, []);
    });

    document.getElementById("submit-btn").addEventListener("click", function () {
      var bodyField = document.getElementById("body");
      var body = bodyField.value.trim();
      var errEl = document.getElementById("err-body");
      var bannedEl = document.getElementById("err-banned");
      bodyField.closest(".field").classList.remove("has-error");
      bannedEl.style.display = "none";

      if (body.length < 10) {
        bodyField.closest(".field").classList.add("has-error");
        errEl.textContent = window.LWI.t("write.errShort");
        return;
      }

      var sourceVal = kind === "evidence" ? document.getElementById("source").value.trim() : "";
      var banned = window.LWI.findBannedTerm(body) || window.LWI.findBannedTerm(sourceVal);
      if (banned) {
        bannedEl.textContent = window.LWI.t("write.errBanned", { "{term}": banned });
        bannedEl.style.display = "block";
        return;
      }

      if (!window.LWI.isConfigured) return;

      var selected = select.options[select.selectedIndex];
      var post = {
        channelId: select.value,
        channelName: selected ? selected.textContent : "",
        authorUid: user.uid,
        authorNickname: profile.nickname,
        body: body,
        kind: kind
      };
      if (kind === "evidence") post.sourceNote = sourceVal;

      var submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.textContent = window.LWI.t(selectedFile ? "write.uploading" : "write.posting");

      var uploadStep = selectedFile
        ? window.LWI.uploadPostImage(user.uid, selectedFile).then(function (url) { post.imageUrl = url; })
        : Promise.resolve();

      uploadStep.then(function () {
        return window.LWI.createPost(post);
      }).then(function (ref) {
        window.location.href = "post.html?id=" + ref.id;
      }).catch(function (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = window.LWI.t("write.submit");
        bannedEl.textContent = err.message || window.LWI.t("write.errGeneric");
        bannedEl.style.display = "block";
      });
    });
  });
</script>
</body>
</html>
