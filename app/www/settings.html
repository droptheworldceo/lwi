<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유병장수 · 설정</title>
<link rel="stylesheet" href="css/lwi.css?v=5">
<style>
  .content { flex: 1; overflow-y: auto; padding: 20px 20px 40px; }
  .group-label { font-size: 12px; font-weight: 700; color: var(--ink-faint); margin: 26px 0 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .group-label:first-child { margin-top: 4px; }
  .setting-row { padding: 14px 15px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; }
  .setting-row .title { font-size: 14.5px; font-weight: 600; margin-bottom: 4px; }
  .setting-row .desc { font-size: 12.5px; color: var(--ink-faint); line-height: 1.6; }
  .lang-card { padding: 6px 15px; }
  .lang-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; cursor: pointer; }
  .lang-row + .lang-row { border-top: 1px solid var(--line); }
  .lang-row .native { font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .lang-row .check { width: 19px; height: 19px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: flex; align-items: center; justify-content: center; flex: none; }
  .lang-row .check svg { width: 11px; height: 11px; color: var(--accent-ink); display: none; }
  .lang-row.selected .check { border-color: var(--accent); background: var(--accent); }
  .lang-row.selected .check svg { display: block; }
  .danger-zone { margin-top: 30px; padding: 16px; border: 1px solid var(--accent); border-radius: 14px; background: var(--accent-ink); }
  .danger-zone .title { font-size: 14.5px; font-weight: 700; color: var(--accent-deep); margin-bottom: 6px; }
  .danger-zone .desc { font-size: 12.5px; color: var(--ink-soft); line-height: 1.7; margin-bottom: 14px; }
  .danger-zone .btn { background: none; border: 1px solid var(--accent-deep); color: var(--accent-deep); }
  .confirm-box { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); display: none; }
  .confirm-box input { width: 100%; font-size: 14px; padding: 12px 13px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); margin-bottom: 10px; }
  .confirm-box .row { display: flex; gap: 8px; }
  .confirm-box .row button { flex: 1; }
</style>
</head>
<body>
<div class="app">
  <a class="kup-banner" href="https://k-uplearning.com" target="_blank" rel="noopener">
    <span class="kup-text">케이업러닝: 배움으로 하나되는 곳 by teamSKY</span>
    <span class="kup-arrow">→</span>
  </a>
  <div class="topbar">
    <a class="back" href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1 data-i18n="settings.title"></h1>
  </div>
  <div class="content">
    <div class="group-label" data-i18n="settings.langTitle"></div>
    <div class="setting-row lang-card">
      <div id="lang-list"></div>
    </div>

    <div class="group-label" data-i18n="settings.notifTitle"></div>
    <div class="setting-row">
      <div class="title" data-i18n="settings.notifTitle"></div>
      <div class="desc" data-i18n="settings.notifDesc"></div>
    </div>

    <div class="danger-zone">
      <div class="title" data-i18n="settings.dangerTitle"></div>
      <div class="desc" data-i18n="settings.dangerDesc"></div>
      <button class="btn" id="delete-open-btn" style="width:auto; padding:10px 16px;" data-i18n="settings.deleteBtn"></button>

      <div class="confirm-box" id="confirm-box">
        <p style="font-size:12.5px; color:var(--ink-soft); margin:0 0 10px;" data-i18n="settings.confirmDesc"></p>
        <input id="confirm-password" type="password" data-i18n-placeholder="settings.passwordPlaceholder">
        <p class="error" id="delete-error" style="display:none;"></p>
        <div class="row">
          <button class="btn btn-ghost" id="delete-cancel-btn" type="button" data-i18n="settings.cancel"></button>
          <button class="btn" id="delete-confirm-btn" type="button" style="background:var(--accent-deep); color:#fff;" data-i18n="settings.deleteConfirm"></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=2"></script>
<script src="js/firebase-init.js?v=2"></script>
<script src="js/auth.js?v=3"></script>
<script src="js/i18n.js?v=3"></script>
<script>
  var checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>';
  var langListEl = document.getElementById("lang-list");
  function renderLangList() {
    var current = window.LWI.getLang();
    langListEl.innerHTML = "";
    window.LWI.LANGS.forEach(function (l) {
      var row = document.createElement("div");
      row.className = "lang-row" + (l.code === current ? " selected" : "");
      row.innerHTML = '<span class="native">' + l.native + '</span><span class="check">' + checkSvg + '</span>';
      row.addEventListener("click", function () {
        window.LWI.setLang(l.code);
        window.LWI.applyI18n(document);
        renderLangList();
      });
      langListEl.appendChild(row);
    });
  }
  renderLangList();

  window.LWI.requireAuth(function (user) {
    if (!window.LWI.isConfigured) return;

    var openBtn = document.getElementById("delete-open-btn");
    var box = document.getElementById("confirm-box");
    var errEl = document.getElementById("delete-error");

    openBtn.addEventListener("click", function () {
      box.style.display = "block";
      openBtn.style.display = "none";
    });
    document.getElementById("delete-cancel-btn").addEventListener("click", function () {
      box.style.display = "none";
      openBtn.style.display = "inline-flex";
      errEl.style.display = "none";
      document.getElementById("confirm-password").value = "";
    });

    document.getElementById("delete-confirm-btn").addEventListener("click", function () {
      var password = document.getElementById("confirm-password").value;
      errEl.style.display = "none";
      if (!password) {
        errEl.textContent = window.LWI.t("settings.errPasswordRequired");
        errEl.style.display = "block";
        return;
      }

      var confirmBtn = document.getElementById("delete-confirm-btn");
      confirmBtn.disabled = true;

      var cred = firebase.auth.EmailAuthProvider.credential(user.email, password);
      user.reauthenticateWithCredential(cred)
        .then(function () { return window.LWI.db.collection("users").doc(user.uid).delete(); })
        .then(function () { return user.delete(); })
        .then(function () { window.location.href = "signup.html"; })
        .catch(function (err) {
          confirmBtn.disabled = false;
          if (err.code === "auth/wrong-password") errEl.textContent = window.LWI.t("settings.errWrongPassword");
          else errEl.textContent = err.message || window.LWI.t("settings.errGeneric");
          errEl.style.display = "block";
        });
    });
  });
</script>
</body>
</html>
