<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유병장수</title>
<link rel="stylesheet" href="css/lwi.css?v=3">
</head>
<body>
<div class="app" style="align-items:center; justify-content:center;">
  <a class="kup-banner" href="https://k-uplearning.com" target="_blank" rel="noopener" style="position:static; width:100%;">
    <span class="kup-badge">AD</span>
    <span class="kup-text">K-Up Learning · AI로 준비하는 토익 · 내신 영어</span>
    <span class="kup-arrow">→</span>
  </a>
  <div style="text-align:center;">
    <div class="spinner"></div>
    <p style="font-family:var(--serif); color:var(--ink-soft); font-size:14px;">유병장수 · LWI</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=2"></script>
<script src="js/firebase-init.js?v=2"></script>
<script src="js/auth.js?v=2"></script>
<script>
  if (!window.LWI.isConfigured) {
    window.location.href = "home.html";
  } else {
    window.LWI.auth.onAuthStateChanged(function (user) {
      if (!user) { window.location.href = "signup.html"; return; }
      user.reload().then(function () {
        if (!user.emailVerified) { window.location.href = "verify.html"; return; }
        window.LWI.db.collection("users").doc(user.uid).get().then(function (doc) {
          window.location.href = doc.exists ? "home.html" : "nickname.html";
        });
      });
    });
  }
</script>
</body>
</html>
