<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유병장수 · 채널</title>
<link rel="stylesheet" href="css/lwi.css">
<style>
  .content { flex: 1; overflow-y: auto; padding: 16px 20px 90px; }
  .ch-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .ch-head .count { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); }
  .join-btn { font-size: 12.5px; font-weight: 700; padding: 8px 15px; border-radius: 18px; border: 1px solid var(--line-strong); background: none; color: var(--ink-soft); cursor: pointer; }
  .join-btn.joined { background: var(--accent-ink); border-color: var(--accent); color: var(--accent-deep); }
  .feed { display: flex; flex-direction: column; gap: 12px; }
  .post-top { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
  .post-who { margin-left: auto; font-size: 11.5px; color: var(--ink-faint); }
  .post-body { margin: 0 0 10px; font-size: 14px; line-height: 1.6; }
  .post-foot { display: flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); }
  .post-foot button, .post-foot a { background: none; border: none; padding: 0; display: flex; align-items: center; gap: 4px; color: inherit; font: inherit; cursor: pointer; }
  .post-foot button.liked { color: var(--accent-deep); font-weight: 700; }
  .post-foot svg { width: 12px; height: 12px; }
  .fab {
    position: fixed; bottom: 90px; right: calc(50% - 240px + 20px); max-width: 480px;
    width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px -8px var(--accent-deep);
  }
  @media (max-width: 520px) { .fab { right: 20px; } }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="channels.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1 id="channel-name">채널</h1>
  </div>
  <div class="content">
    <div class="ch-head">
      <span class="count" id="channel-count">- 명 참여 중</span>
      <button class="join-btn" id="join-btn">참여하기</button>
    </div>
    <div class="feed" id="feed"><div class="empty-state"><p>불러오는 중...</p></div></div>
  </div>
  <a class="fab" id="write-link" href="write.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
  </a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script>
  var params = new URLSearchParams(window.location.search);
  var channelId = params.get("id");
  document.getElementById("write-link").href = "write.html?channel=" + encodeURIComponent(channelId || "");

  function heartIcon() { return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.2 2 4.5 5.6 4c2-.3 3.8.6 5 2.2 1.2-1.6 3-2.5 5-2.2 3.6.5 5.2 4.2 3.6 7.7C19.5 16.4 12 21 12 21z"/></svg>'; }
  function commentIcon() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.4 9 9 0 0 1-3.8-.9L3 20l1.3-4.3a8.5 8.5 0 0 1-1.1-4.2A8.4 8.4 0 0 1 12 3a8.3 8.3 0 0 1 9 8.5z"/></svg>'; }

  function renderFeed(posts) {
    var el = document.getElementById("feed");
    if (!posts.length) { el.innerHTML = '<div class="empty-state"><p>아직 이 채널엔 이야기가 없어요. 첫 이야기를 남겨보세요.</p></div>'; return; }
    el.innerHTML = "";
    posts.forEach(function (p) {
      var div = document.createElement("div");
      div.className = "card";
      div.innerHTML =
        '<div class="post-top">' +
          '<span class="kind ' + (p.kind === "evidence" ? "evi" : "exp") + '">' + (p.kind === "evidence" ? "근거자료" : "경험담") + '</span>' +
          '<span class="post-who">' + (p.authorNickname || "익명") + '</span>' +
        '</div>' +
        '<p class="post-body"><a href="post.html?id=' + p.id + '" style="color:inherit;">' + (p.body || "").slice(0, 90) + '</a></p>' +
        '<div class="post-foot">' +
          '<button data-like="' + p.id + '">' + heartIcon() + '<span>' + (p.empathyCount || 0) + '</span></button>' +
          '<a href="post.html?id=' + p.id + '">' + commentIcon() + '<span>' + (p.commentCount || 0) + '</span></a>' +
        '</div>';
      el.appendChild(div);
    });
  }

  window.LWI.requireAuth(function (user, profile) {
    if (!channelId) { window.location.href = "channels.html"; return; }
    if (!window.LWI.isConfigured) return;

    var uid = user.uid;
    var joined = (profile.joinedChannels || []).indexOf(channelId) !== -1;
    var joinBtn = document.getElementById("join-btn");
    joinBtn.textContent = joined ? "참여중" : "참여하기";
    joinBtn.classList.toggle("joined", joined);
    joinBtn.addEventListener("click", function () {
      window.LWI.joinChannel(uid, channelId).then(function () {
        joinBtn.textContent = "참여중";
        joinBtn.classList.add("joined");
      });
    });

    window.LWI.db.collection("channels").doc(channelId).get().then(function (doc) {
      var data = doc.exists ? doc.data() : (window.LWI.FALLBACK_MAIN_CHANNELS.find(function (c) { return c.id === channelId; }) || { name: "채널", memberCount: 0 });
      document.getElementById("channel-name").textContent = data.name;
      document.getElementById("channel-count").textContent = (data.memberCount || 0) + "명 참여 중";
    });

    window.LWI.listPosts({ channelId: channelId, limitN: 30 }).then(renderFeed);

    document.getElementById("feed").addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-like]");
      if (!btn) return;
      window.LWI.toggleEmpathy(btn.dataset.like, uid).then(function (liked) {
        var countEl = btn.querySelector("span");
        var n = parseInt(countEl.textContent, 10) || 0;
        countEl.textContent = liked ? n + 1 : Math.max(0, n - 1);
        btn.classList.toggle("liked", liked);
      });
    });
  });
</script>
</body>
</html>
