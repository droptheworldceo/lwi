<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유병장수 · 채널</title>
<link rel="stylesheet" href="css/lwi.css?v=5">
<style>
  .content { flex: 1; overflow-y: auto; padding: 16px 20px 24px; }
  .group-label { font-size: 12px; font-weight: 700; color: var(--ink-faint); margin: 22px 0 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .group-label:first-child { margin-top: 4px; }
  .ch-row { display: flex; flex-direction: column; gap: 9px; padding: 14px 15px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; }
  .ch-row-top { display: flex; align-items: center; }
  .ch-row-top a { font-size: 15px; font-weight: 600; flex: 1; }
  .ch-row-top .count { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); margin-right: 10px; }
  .ch-row-top button { font-size: 12px; font-weight: 700; padding: 7px 13px; border-radius: 16px; border: 1px solid var(--line-strong); background: none; color: var(--ink-soft); cursor: pointer; }
  .ch-row-top button.joined { background: var(--accent-ink); border-color: var(--accent); color: var(--accent-deep); }
  .promo-track { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
  .promo-fill { height: 100%; background: var(--accent-2); border-radius: 2px; }
  .promo-label { font-size: 11px; color: var(--ink-faint); }
  .promo-label.ready { color: var(--accent-deep); font-weight: 700; }
  .new-channel { margin-top: 26px; padding: 16px; border: 1px dashed var(--line-strong); border-radius: 14px; }
  .new-channel .row { display: flex; gap: 8px; }
  .new-channel input { flex: 1; font-size: 14px; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); }
  .new-channel button { flex: none; }
  .new-channel p { font-size: 12px; color: var(--ink-faint); margin: 10px 0 0; }
</style>
</head>
<body>
<div class="app">
  <a class="kup-banner" href="https://k-uplearning.com" target="_blank" rel="noopener">
    <span class="kup-text">케이업러닝: 배움으로 하나되는 곳 by teamSKY</span>
    <span class="kup-arrow">→</span>
  </a>
  <div class="topbar">
    <a class="back" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1 data-i18n="channels.title"></h1>
    <a class="action" href="search.html" style="display:flex;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></a>
  </div>
  <div class="content">
    <div class="group-label" data-i18n="channels.mainChannels"></div>
    <div id="main-channels"><div class="empty-state"><p>…</p></div></div>

    <div class="group-label" data-i18n="channels.subChannels"></div>
    <div id="sub-channels"><div class="empty-state"><p data-i18n="channels.empty"></p></div></div>

    <div class="new-channel">
      <div class="row">
        <input id="new-name" type="text" maxlength="16" data-i18n-placeholder="channels.newChannelPlaceholder">
        <button class="btn btn-primary" style="width:auto;" id="new-btn" data-i18n="channels.newChannelBtn"></button>
      </div>
      <p data-i18n="channels.newChannelNote"></p>
    </div>
  </div>

  <nav class="tabbar">
    <a class="tab" href="home.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg>
      <span data-i18n="nav.home"></span>
    </a>
    <a class="tab" href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.4-3.6 4.3-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg>
      <span data-i18n="nav.me"></span>
    </a>
  </nav>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=2"></script>
<script src="js/firebase-init.js?v=2"></script>
<script src="js/auth.js?v=3"></script>
<script src="js/data.js?v=8"></script>
<script src="js/i18n.js?v=3"></script>
<script>
  function renderList(el, channels, joined, uid) {
    if (!channels.length) { el.innerHTML = '<div class="empty-state"><p>' + window.LWI.t("channels.empty") + '</p></div>'; return; }
    el.innerHTML = "";
    channels.forEach(function (c) {
      var row = document.createElement("div");
      row.className = "ch-row";
      var isJoined = joined.indexOf(c.id) !== -1;
      var top =
        '<div class="ch-row-top">' +
          '<a href="channel.html?id=' + c.id + '">' + c.name + '</a>' +
          '<span class="count">' + window.LWI.t("channels.memberCountShort", { "{n}": c.memberCount || 0 }) + '</span>' +
          '<button data-join="' + c.id + '" class="' + (isJoined ? "joined" : "") + '">' + window.LWI.t(isJoined ? "channels.joined" : "channels.join") + '</button>' +
        '</div>';
      var promo = "";
      if (c.tier === "sub") {
        var count = c.memberCount || 0;
        var threshold = window.LWI.MAIN_PROMOTION_THRESHOLD;
        var pct = Math.min(100, Math.round((count / threshold) * 100));
        promo = count >= threshold
          ? '<div class="promo-label ready">' + window.LWI.t("channels.promoReady") + '</div>'
          : '<div class="promo-track"><div class="promo-fill" style="width:' + pct + '%"></div></div>' +
            '<div class="promo-label">' + window.LWI.t("channels.promoLabel", { "{n}": threshold - count }) + '</div>';
      }
      row.innerHTML = top + promo;
      el.appendChild(row);
    });
    el.querySelectorAll("button[data-join]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (!uid) return;
        window.LWI.joinChannel(uid, btn.dataset.join).then(function () {
          btn.textContent = window.LWI.t("channels.joined");
          btn.classList.add("joined");
        });
      });
    });
  }

  window.LWI.requireAuth(function (user, profile) {
    var uid = user ? user.uid : null;
    var joined = (profile && profile.joinedChannels) || [];

    if (!window.LWI.isConfigured) {
      renderList(document.getElementById("main-channels"), window.LWI.FALLBACK_MAIN_CHANNELS, []);
      return;
    }

    Promise.all([window.LWI.listChannels("main"), window.LWI.listChannels("sub")]).then(function (results) {
      var mains = results[0].length ? results[0] : window.LWI.FALLBACK_MAIN_CHANNELS;
      renderList(document.getElementById("main-channels"), mains, joined, uid);
      renderList(document.getElementById("sub-channels"), results[1], joined, uid);
    }).catch(function (err) {
      console.error("listChannels failed", err);
      renderList(document.getElementById("main-channels"), window.LWI.FALLBACK_MAIN_CHANNELS, joined, uid);
    });

    document.getElementById("new-btn").addEventListener("click", function () {
      var input = document.getElementById("new-name");
      var name = input.value.trim();
      if (!name) return;
      window.LWI.createChannel(name, "sub").then(function (ref) {
        return window.LWI.joinChannel(uid, ref.id);
      }).then(function () {
        window.location.reload();
      });
    });
  });
</script>
</body>
</html>
