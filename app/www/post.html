<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유병장수 · 이야기</title>
<link rel="stylesheet" href="css/lwi.css?v=2">
<style>
  .content { flex: 1; overflow-y: auto; padding: 16px 20px 90px; }
  .post-top { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; }
  .post-who { margin-left: auto; font-size: 12px; color: var(--ink-faint); }
  .post-body { font-size: 15.5px; line-height: 1.8; white-space: pre-wrap; margin: 0 0 8px; }
  .source-note { font-size: 12.5px; color: var(--accent-2); background: var(--accent-2-soft); padding: 8px 12px; border-radius: 10px; margin-bottom: 16px; }
  .disclaimer { font-size: 11.5px; color: var(--ink-faint); border-top: 1px solid var(--line); padding-top: 12px; margin-bottom: 20px; }
  .empathy-row { display: flex; justify-content: center; margin: 8px 0 26px; }
  .empathy-btn {
    display: flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 24px;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-soft); cursor: pointer; font-size: 14px; font-weight: 700;
  }
  .empathy-btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .empathy-btn svg { width: 16px; height: 16px; }
  .comments-label { font-size: 13px; font-weight: 700; margin-bottom: 12px; }
  .comment { padding: 12px 0; border-top: 1px solid var(--line); }
  .comment .who-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .comment .who { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .comment .report-link { font-size: 11px; color: var(--ink-faint); background: none; border: none; cursor: pointer; padding: 0; }
  .comment .body { font-size: 14px; line-height: 1.6; }
  .comment-form { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; display: flex; gap: 8px; padding: 12px 20px calc(env(safe-area-inset-bottom, 0) + 12px); background: var(--surface); border-top: 1px solid var(--line); }
  .comment-form input { flex: 1; font-size: 14px; padding: 12px 14px; border-radius: 20px; border: 1px solid var(--line-strong); background: var(--bg); }
  .comment-form button { flex: none; font-size: 13px; font-weight: 700; padding: 0 18px; border-radius: 20px; border: none; background: var(--accent); color: var(--accent-ink); }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" id="back-link" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1 id="topbar-channel">이야기</h1>
  </div>
  <div class="content">
    <div class="card" style="margin-bottom:16px;">
      <div class="post-top">
        <span class="kind" id="post-kind"></span>
        <span class="post-who" id="post-who"></span>
        <button class="kebab-btn" id="post-kebab" aria-label="더보기"></button>
      </div>
      <p class="post-body" id="post-body"></p>
      <div class="source-note" id="source-note" style="display:none;"></div>
      <div class="disclaimer">이 내용은 개인 경험 또는 참고 정보이며, 병원 치료를 대체하지 않습니다.</div>
    </div>

    <div class="empathy-row">
      <button class="empathy-btn" id="empathy-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.2 2 4.5 5.6 4c2-.3 3.8.6 5 2.2 1.2-1.6 3-2.5 5-2.2 3.6.5 5.2 4.2 3.6 7.7C19.5 16.4 12 21 12 21z"/></svg>
        <span id="empathy-count">저도 그래요</span>
      </button>
    </div>

    <div class="comments-label">댓글 <span id="comment-count">0</span></div>
    <div id="comments"><div class="empty-state"><p>아직 댓글이 없어요.</p></div></div>
  </div>

  <form class="comment-form" id="comment-form">
    <input id="comment-input" type="text" placeholder="따뜻한 댓글을 남겨보세요" maxlength="300">
    <button type="submit">남기기</button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=2"></script>
<script src="js/firebase-init.js?v=2"></script>
<script src="js/auth.js?v=2"></script>
<script src="js/data.js?v=4"></script>
<script src="js/ui.js?v=1"></script>
<script>
  var params = new URLSearchParams(window.location.search);
  var postId = params.get("id");
  var currentUid = null;
  var blockedUsers = {};

  function renderComments(list) {
    var el = document.getElementById("comments");
    list = window.LWI.filterBlocked(list, blockedUsers);
    document.getElementById("comment-count").textContent = list.length;
    if (!list.length) { el.innerHTML = '<div class="empty-state"><p>아직 댓글이 없어요.</p></div>'; return; }
    el.innerHTML = "";
    list.forEach(function (c) {
      var div = document.createElement("div");
      div.className = "comment";
      div.innerHTML =
        '<div class="who-row"><span class="who">' + (c.authorNickname || "익명") + '</span>' +
        (c.authorUid === currentUid ? "" : '<button class="report-link" data-report-comment="' + c.id + '" data-author="' + c.authorUid + '" data-author-name="' + (c.authorNickname || "익명") + '">신고</button>') +
        '</div><div class="body"></div>';
      div.querySelector(".body").textContent = c.body;
      el.appendChild(div);
    });
  }

  window.LWI.requireAuth(function (user, profile) {
    if (!postId) { window.location.href = "home.html"; return; }
    if (!window.LWI.isConfigured) return;
    var uid = user.uid;
    currentUid = uid;
    blockedUsers = profile.blockedUsers || {};

    document.getElementById("comments").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-report-comment]");
      if (!btn) return;
      window.LWI.openReportBlockSheet({
        targetType: "comment",
        targetId: btn.dataset.reportComment,
        postId: postId,
        authorUid: btn.dataset.author,
        authorNickname: btn.dataset.authorName,
        reporterUid: uid,
        isOwn: false,
        onBlocked: function () {
          blockedUsers[btn.dataset.author] = btn.dataset.authorName;
          window.LWI.listComments(postId).then(renderComments);
        }
      });
    });

    window.LWI.getPost(postId).then(function (post) {
      if (!post) return;
      document.getElementById("back-link").href = "channel.html?id=" + encodeURIComponent(post.channelId);
      document.getElementById("topbar-channel").textContent = post.channelName || "이야기";
      var kindEl = document.getElementById("post-kind");
      kindEl.textContent = post.kind === "evidence" ? "근거자료" : "경험담";
      kindEl.classList.add(post.kind === "evidence" ? "evi" : "exp");
      document.getElementById("post-who").textContent = post.authorNickname || "익명";
      document.getElementById("post-body").textContent = post.body;
      if (post.kind === "evidence" && post.sourceNote) {
        var sn = document.getElementById("source-note");
        sn.style.display = "block";
        sn.textContent = "출처: " + post.sourceNote;
      }

      var isOwnPost = post.authorUid === uid;
      var kebabBtn = document.getElementById("post-kebab");
      kebabBtn.innerHTML = window.LWI.kebabIconHtml();
      kebabBtn.addEventListener("click", function () {
        window.LWI.openReportBlockSheet({
          targetType: "post",
          targetId: postId,
          postId: postId,
          authorUid: post.authorUid,
          authorNickname: post.authorNickname,
          reporterUid: uid,
          isOwn: isOwnPost,
          onBlocked: function () { window.location.href = "home.html"; }
        });
      });

      var empathyBtn = document.getElementById("empathy-btn");
      var empathyCountEl = document.getElementById("empathy-count");
      function setEmpathyLabel(count, on) {
        empathyCountEl.textContent = "저도 그래요 · " + count;
        empathyBtn.classList.toggle("on", on);
      }
      setEmpathyLabel(post.empathyCount || 0, false);
      window.LWI.db.collection("posts").doc(postId).collection("reactions").doc(uid).get().then(function (d) {
        setEmpathyLabel(post.empathyCount || 0, d.exists);
      });
      empathyBtn.addEventListener("click", function () {
        window.LWI.toggleEmpathy(postId, uid).then(function (liked) {
          var current = (post.empathyCount || 0) + (liked ? 1 : 0);
          post.empathyCount = liked ? current : Math.max(0, current - 1);
          setEmpathyLabel(post.empathyCount, liked);
        });
      });
    });

    window.LWI.listComments(postId).then(renderComments);

    document.getElementById("comment-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var input = document.getElementById("comment-input");
      var body = input.value.trim();
      if (!body) return;
      window.LWI.addComment(postId, { authorUid: uid, authorNickname: profile.nickname, body: body }).then(function () {
        input.value = "";
        return window.LWI.listComments(postId);
      }).then(renderComments);
    });
  });
</script>
</body>
</html>
