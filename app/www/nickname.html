<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유병장수 · 닉네임 설정</title>
<link rel="stylesheet" href="css/lwi.css?v=2">
<style>
  .center { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 28px 24px; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 21px; margin: 0 0 8px; }
  p.desc { font-size: 14px; color: var(--ink-soft); margin: 0 0 28px; line-height: 1.7; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin: -8px 0 20px; }
  .suggestions button {
    font-size: 12.5px; padding: 7px 13px; border-radius: 18px; border: 1px dashed var(--line-strong);
    background: none; color: var(--ink-faint); cursor: pointer;
  }
</style>
</head>
<body>
<div class="app">
  <div class="center">
    <h1 data-i18n-html="nickname.titleHtml"></h1>
    <p class="desc" data-i18n="nickname.desc"></p>
    <div class="suggestions" id="suggestions"></div>
    <div class="field">
      <label for="nickname" data-i18n="nickname.label"></label>
      <input id="nickname" type="text" maxlength="12" data-i18n-placeholder="nickname.placeholder" required>
      <div class="error" id="err-nickname"></div>
    </div>
    <button class="btn btn-primary" id="submit-btn" data-i18n="nickname.submit"></button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=2"></script>
<script src="js/firebase-init.js?v=2"></script>
<script src="js/auth.js?v=2"></script>
<script src="js/data.js?v=7"></script>
<script src="js/i18n.js?v=1"></script>
<script>
  var picks = ["고요한하루", "느긋한바람", "맑은아침", "코숨쉬기", "천천히걷기"];
  var suggestionsEl = document.getElementById("suggestions");
  var input = document.getElementById("nickname");
  picks.forEach(function (name) {
    var b = document.createElement("button");
    b.type = "button"; b.textContent = name;
    b.addEventListener("click", function () { input.value = name; });
    suggestionsEl.appendChild(b);
  });

  var currentUser = null;
  if (window.LWI.isConfigured) {
    window.LWI.auth.onAuthStateChanged(function (user) {
      if (!user) { window.location.href = "signup.html"; return; }
      currentUser = user;
    });
  }

  document.getElementById("submit-btn").addEventListener("click", function () {
    var field = input.closest(".field");
    field.classList.remove("has-error");
    var nickname = input.value.trim();

    if (nickname.length < 2) {
      field.classList.add("has-error");
      document.getElementById("err-nickname").textContent = window.LWI.t("nickname.errShort");
      return;
    }
    if (!window.LWI.isConfigured || !currentUser) {
      field.classList.add("has-error");
      document.getElementById("err-nickname").textContent = window.LWI.t("auth.notConfigured");
      return;
    }
    window.LWI.createUserProfile(currentUser.uid, nickname).then(function () {
      window.location.href = "home.html";
    }).catch(function (err) {
      field.classList.add("has-error");
      document.getElementById("err-nickname").textContent = err.message || window.LWI.t("auth.errGeneric");
    });
  });
</script>
</body>
</html>
