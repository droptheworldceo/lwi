<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유병장수 · 홈</title>
<link rel="stylesheet" href="css/lwi.css?v=5">
<style>
  .content { flex: 1; overflow-y: auto; padding: 18px 20px 24px; display: flex; flex-direction: column; }
  .points-card {
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    color: var(--accent-ink); border-radius: 20px; padding: 22px 22px 20px; margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .points-card .points-label { font-size: 12px; opacity: 0.85; margin-bottom: 6px; }
  .points-card .points-value { font-family: var(--serif); font-size: 30px; font-weight: 600; }
  .points-card .streak-pill {
    font-family: var(--mono); font-size: 12px; background: rgba(255,255,255,0.22);
    padding: 7px 13px; border-radius: 20px; white-space: nowrap;
  }
  .checkin-card { margin-bottom: 18px; }
  .checkin-card .q { font-size: 15px; font-weight: 700; margin: 0 0 14px; text-align: center; }
  .mood-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .mood-btn { flex: 1; padding: 14px 4px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; color: var(--ink-soft); cursor: pointer; }
  .mood-btn.on { border-color: var(--accent); color: var(--accent-deep); background: var(--accent-ink); font-weight: 700; }
  .checkin-btn { display: none; }
  .checkin-btn.show { display: flex; }
  .done-state { display: none; text-align: center; padding: 18px 10px 6px; }
  .done-state.show { display: block; }
  .done-state .big { font-size: 34px; margin-bottom: 6px; }
  .done-state p { font-size: 13.5px; color: var(--ink-soft); margin: 0; }
  .earn-toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 700; padding: 11px 20px;
    border-radius: 20px; z-index: 60; opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .earn-toast.show { opacity: 0.95; transform: translateX(-50%) translateY(0); }
  .badge-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .badge-chip { font-size: 11.5px; font-weight: 700; padding: 6px 12px; border-radius: 16px; background: var(--accent-2-soft); color: var(--accent-2); }
</style>
</head>
<body>
<div class="app">
  <a class="kup-banner" href="https://k-uplearning.com" target="_blank" rel="noopener">
    <span class="kup-text">케이업러닝: 배움으로 하나되는 곳 by teamSKY</span>
    <span class="kup-arrow">→</span>
  </a>
  <div class="topbar">
    <h1>유병장수 <span style="color:var(--accent-deep)">· LWI</span></h1>
    <a class="action" href="profile.html" data-i18n="nav.me"></a>
  </div>

  <div class="content">
    <div class="points-card">
      <div>
        <div class="points-label" data-i18n="home.pointsLabel"></div>
        <div class="points-value" id="points-value">0</div>
      </div>
      <div class="streak-pill" id="streak-pill" data-i18n="home.streakZero"></div>
    </div>

    <div class="card checkin-card">
      <div id="checkin-form">
        <p class="q" data-i18n="home.checkinQ"></p>
        <div class="mood-row" id="mood-row">
          <button class="mood-btn" data-mood="힘듦" data-i18n="home.moodTough"></button>
          <button class="mood-btn" data-mood="피곤" data-i18n="home.moodTired"></button>
          <button class="mood-btn" data-mood="보통" data-i18n="home.moodNormal"></button>
          <button class="mood-btn" data-mood="좋음" data-i18n="home.moodGood"></button>
        </div>
        <button class="btn btn-primary checkin-btn" id="checkin-btn" data-i18n="home.checkinBtn"></button>
      </div>
      <div class="done-state" id="done-state">
        <div class="big">✅</div>
        <p id="done-text"></p>
      </div>
    </div>

    <div class="badge-row" id="badge-row"></div>
  </div>

  <div class="earn-toast" id="earn-toast"></div>

  <nav class="tabbar">
    <a class="tab on" href="home.html">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg>
      <span data-i18n="nav.home"></span>
    </a>
    <a class="tab" href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.4-3.6 4.3-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg>
      <span data-i18n="nav.me"></span>
    </a>
  </nav>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
<script src="js/firebase-config.js?v=2"></script>
<script src="js/firebase-init.js?v=2"></script>
<script src="js/auth.js?v=3"></script>
<script src="js/data.js?v=8"></script>
<script src="js/ui.js?v=1"></script>
<script src="js/i18n.js?v=2"></script>
<script>
  var selectedMood = null;
  var currentPoints = 0;

  function renderBadges(badges) {
    var el = document.getElementById("badge-row");
    el.innerHTML = "";
    (badges || []).forEach(function (b) {
      var span = document.createElement("span");
      span.className = "badge-chip";
      span.textContent = window.LWI.t("home.badge_" + b);
      el.appendChild(span);
    });
  }

  function renderStreak(streak) {
    var pill = document.getElementById("streak-pill");
    pill.textContent = streak > 0 ? window.LWI.t("home.streak", { "{n}": streak }) : window.LWI.t("home.streakZero");
  }

  function showEarnToast(points) {
    var toast = document.getElementById("earn-toast");
    toast.textContent = window.LWI.t("home.earnToast", { "{n}": points });
    toast.classList.add("show");
    setTimeout(function () { toast.classList.remove("show"); }, 2200);
  }

  function showDoneState(streak) {
    document.getElementById("checkin-form").style.display = "none";
    var doneEl = document.getElementById("done-state");
    doneEl.classList.add("show");
    document.getElementById("done-text").textContent = window.LWI.t("home.doneText", { "{n}": streak });
  }

  window.LWI.requireAuth(function (user, profile) {
    if (!user) {
      // Firebase 미설정 상태 — 데모용 정적 표시
      document.getElementById("points-value").textContent = "0";
      renderStreak(0);
      return;
    }

    currentPoints = profile.points || 0;
    document.getElementById("points-value").textContent = currentPoints;
    renderStreak(profile.streak || 0);
    renderBadges(profile.badges);

    window.LWI.getTodayCheckin(user.uid).then(function (checkin) {
      if (checkin) {
        showDoneState(profile.streak || 0);
      } else {
        document.querySelectorAll(".mood-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            document.querySelectorAll(".mood-btn").forEach(function (b) { b.classList.remove("on"); });
            btn.classList.add("on");
            selectedMood = btn.dataset.mood;
            document.getElementById("checkin-btn").classList.add("show");
          });
        });
      }
    });

    document.getElementById("checkin-btn").addEventListener("click", function (e) {
      if (!selectedMood) return;
      var btn = e.currentTarget;
      btn.disabled = true;
      window.LWI.checkIn(selectedMood, false).then(function (result) {
        currentPoints += result.pointsAwarded;
        document.getElementById("points-value").textContent = currentPoints;
        renderStreak(result.streak);
        if (result.newBadges && result.newBadges.length) {
          renderBadges((profile.badges || []).concat(result.newBadges));
        }
        showEarnToast(result.pointsAwarded);
        showDoneState(result.streak);
      }).catch(function (err) {
        btn.disabled = false;
        console.error("checkIn failed", err);
        window.LWI.showToast && window.LWI.showToast(err.message || window.LWI.t("auth.errGeneric"));
      });
    });
  });
</script>
</body>
</html>
